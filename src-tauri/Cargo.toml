[package]
name = "digivision-demo"
version = "0.1.0"
description = "DigiVision Demo desktop shell"
authors = ["DigiVision"]
edition = "2021"

[lib]
name = "digivision_demo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
